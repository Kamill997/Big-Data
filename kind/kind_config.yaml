kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bigdata-project
nodes:
  - role: control-plane
    labels:
      custom-label: "control-plane"
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
  - role: worker
    labels:
      custom-label: "worker"

