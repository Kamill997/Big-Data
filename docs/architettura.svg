<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<style>
.t{font-size:15px;font-weight:600;fill:#0f172a;text-anchor:middle}
.s{font-size:12px;fill:#475569;text-anchor:middle}
.l{font-size:12px;fill:#334155;text-anchor:middle;font-style:italic}
.e{stroke:#475569;stroke-width:1.8;fill:none}
</style></defs>
<rect width="1100" height="680" fill="#ffffff"/>
<text x="550" y="32" class="t" style="font-size:20px">Architettura del sistema – Big Data Homework 3</text>

<!-- Client -->
<rect x="400" y="55" width="200" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="500" y="85" class="t">Client (Postman)</text>
<!-- Gateway -->
<rect x="350" y="150" width="300" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="500" y="177" class="t">API Gateway / Ingress</text>
<text x="500" y="196" class="s">NGINX · TLS · :8443</text>
<path class="e" d="M500 105V150" marker-end="url(#a)"/>
<text x="525" y="132" class="l" text-anchor="start" style="text-anchor:start">HTTPS</text>

<!-- User Manager / Data Collector -->
<rect x="90" y="280" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="200" y="310" class="t">User Manager</text><text x="200" y="330" class="s">REST + gRPC server · metriche :9102</text>
<rect x="400" y="280" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="510" y="310" class="t">Data Collector</text><text x="510" y="330" class="s">REST + scheduler 2h · metriche :8000</text>
<path class="e" d="M440 210V245H200V280" marker-end="url(#a)"/>
<text x="250" y="238" class="l">/user_manager</text>
<path class="e" d="M560 210V245H510V280" marker-end="url(#a)"/>
<text x="650" y="238" class="l" style="text-anchor:start">/data_collector</text>
<path class="e" d="M310 315H400" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="355" y="305" class="l">gRPC</text><text x="355" y="338" class="s" style="font-size:11px">:50051</text>

<!-- OpenSky -->
<rect x="820" y="280" width="200" height="70" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
<text x="920" y="310" class="t">OpenSky Network</text><text x="920" y="330" class="s">API esterna · Circuit Breaker</text>
<path class="e" d="M620 315H820" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="720" y="306" class="l">API (OAuth2)</text>

<!-- DBs -->
<rect x="110" y="440" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="200" y="467" class="t">User DB</text><text x="200" y="486" class="s">MySQL</text>
<path class="e" d="M200 350V440" marker-end="url(#a)"/>
<rect x="410" y="440" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="467" class="t">Data DB</text><text x="500" y="486" class="s">MySQL</text>
<path class="e" d="M500 350V440" marker-end="url(#a)"/>

<!-- Kafka -->
<rect x="720" y="440" width="200" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="820" y="467" class="t">Kafka</text><text x="820" y="486" class="s">broker (KRaft)</text>
<path class="e" d="M590 350V395H820V440" marker-end="url(#a)"/>
<text x="705" y="388" class="l">topic: to-alert-system</text>

<!-- Alert / Notifier / Email -->
<rect x="720" y="580" width="200" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="820" y="607" class="t">Alert System</text><text x="820" y="626" class="s">soglie · metriche :8001</text>
<path class="e" d="M820 500V580" marker-end="url(#a)"/>
<text x="832" y="545" class="l" style="text-anchor:start">consuma</text>

<rect x="410" y="580" width="200" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="510" y="607" class="t">Notifier System</text><text x="510" y="626" class="s">invio e-mail · metriche :8002</text>
<path class="e" d="M720 610H610" marker-end="url(#a)"/>
<text x="665" y="573" class="l">topic: to-notifier</text>
<path class="e" d="M665 578V607" stroke-dasharray="3 3" style="display:none"/>

<rect x="110" y="580" width="200" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="210" y="607" class="t">E-mail all'utente</text><text x="210" y="626" class="s">SMTP Gmail</text>
<path class="e" d="M410 610H310" marker-end="url(#a)"/>

<!-- Prometheus -->
<rect x="860" y="60" width="200" height="70" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="960" y="90" class="t">Prometheus</text><text x="960" y="110" class="s">scrape delle metriche · :9090</text>
<path d="M960 130V200H200V280" stroke="#c2410c" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#a)" style="display:none"/>
<text x="960" y="152" class="s" style="font-size:11px">raccoglie le metriche di User Manager,</text>
<text x="960" y="167" class="s" style="font-size:11px">Data Collector, Alert System, Notifier</text>
</svg>
