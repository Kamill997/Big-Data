global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'data_collector'
    static_configs:
      - targets: ['container_data_collector:8000']

  - job_name: 'user_manager'
    static_configs:
      - targets: [ 'container_user_manager:9102' ]

  - job_name: 'alert_system'
    static_configs:
      - targets: ['alert_system:8001']

  - job_name: 'notifier_system'
    static_configs:
      - targets: [ 'notifier_system:8002' ]